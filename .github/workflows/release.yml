name: Release

on:
  push:
    tags:
      # release-please tags this package as oxidedock-vX.Y.Z. Pre-release tags
      # (e.g. oxidedock-v1.0.0-beta.1) intentionally excluded.
      - 'oxidedock-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build/release (e.g. oxidedock-v0.7.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'apple') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/linux-deps

      - run: bun install --frozen-lockfile

      # tauri-action v1 always calls updateRelease on an existing published
      # release, and an unset releaseBody blanks it (create-release.ts:148,
      # `bodyFileContent || body`). Read release-please's changelog back out
      # and hand it to the action so it rewrites the body with itself.
      - name: Capture existing release body
        id: release-body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_BODY_EOF'
            gh release view "${{ inputs.tag || github.ref_name }}" \
              --repo "$GITHUB_REPOSITORY" --json body --jq .body || true
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # release-please already publishes a GitHub Release on this tag with the
          # changelog as the body. With releaseDraft=false, tauri-action attaches
          # build artifacts to that existing release instead of creating a
          # separate empty draft (see issue #38).
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.release-body.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
